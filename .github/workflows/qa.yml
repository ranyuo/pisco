name: Portal QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Browser dependency hashes and published npm advisories
        run: python3 tests/vendor-audit.py --advisories
      - name: Installation, integrity, permissions, backups, SMTP and bulk data
        env:
          PORTAL_TEST_PHP_VERSION: ${{ matrix.php }}
        run: bash tests/run.sh
